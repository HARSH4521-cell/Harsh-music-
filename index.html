<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;800&display=swap" rel="stylesheet">
<style>
:root{--bg:#06080b;--tx:#eef6fa;--mut:#8aa0ac;--ac:#3cc8f0;--gl:rgba(255,255,255,.07);--gl2:rgba(14,20,26,.72);--bd:rgba(255,255,255,.12);--sh:0 10px 40px rgba(0,0,0,.5)}
:root[data-t=light]{--bg:#eef4f8;--tx:#0b1a22;--mut:#5b7280;--ac:#0597c9;--gl:rgba(255,255,255,.6);--gl2:rgba(255,255,255,.75);--bd:rgba(10,40,60,.1);--sh:0 10px 40px rgba(10,40,60,.15)}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{font-family:Sora,system-ui,sans-serif;background:var(--bg);color:var(--tx);overflow:hidden;transition:background .4s}
body:before{content:"";position:fixed;inset:-20%;background:radial-gradient(circle at 15% 10%,color-mix(in srgb,var(--ac) 30%,transparent),transparent 40%),radial-gradient(circle at 90% 70%,color-mix(in srgb,var(--ac) 18%,transparent),transparent 45%);z-index:0}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{width:1em;height:1em;fill:currentColor;display:block}
.glass{background:var(--gl);border:1px solid var(--bd);backdrop-filter:blur(22px) saturate(1.6);-webkit-backdrop-filter:blur(22px) saturate(1.6)}
#app{position:relative;z-index:1;height:100%;max-width:640px;margin:auto;display:flex;flex-direction:column}
header{display:flex;align-items:center;gap:10px;padding:calc(env(safe-area-inset-top,0px) + 14px) 18px 8px}
header img{width:38px;height:38px;border-radius:12px;object-fit:cover}
header b{font-size:19px;font-weight:800;letter-spacing:-.3px;flex:1}
.ib{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;font-size:20px}
main{flex:1;overflow-y:auto;padding:6px 18px 190px;scrollbar-width:none}
main::-webkit-scrollbar{display:none}
.view{display:none;animation:in .35s ease}.view.on{display:block}
@keyframes in{from{opacity:0;transform:translateY(8px)}}
h2{font-size:22px;font-weight:800;margin:18px 0 12px;letter-spacing:-.4px}
.chips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding-bottom:4px}
.chip{flex:none;padding:9px 16px;border-radius:99px;font-size:13px;font-weight:600;transition:transform .15s,background .2s}
.chip:active{transform:scale(.94)}.chip.on{background:var(--ac);color:#031017;border-color:transparent}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{border-radius:18px;padding:10px;text-align:left;transition:transform .2s}
.card:active{transform:scale(.97)}
.card img,.row img{width:100%;aspect-ratio:1;object-fit:cover;border-radius:12px;background:#111}
.card p{font-size:13px;font-weight:600;margin:8px 2px 0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.card small,.row small{color:var(--mut);font-size:11.5px;margin:2px;display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:flex;align-items:center;gap:12px;padding:8px;border-radius:16px;margin-bottom:8px;width:100%;text-align:left}
.row img{width:54px;height:54px;flex:none}.row div{flex:1;min-width:0}
.row p{font-size:14px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row.cur p{color:var(--ac)}
.like.on{color:#ff4d79}
.sk{height:190px;border-radius:18px;background:linear-gradient(100deg,var(--gl) 30%,var(--bd) 50%,var(--gl) 70%) 0 0/300% 100%;animation:sh 1.3s infinite}
@keyframes sh{to{background-position:-300% 0}}
.search{display:flex;align-items:center;gap:10px;padding:0 16px;border-radius:99px;height:50px;margin-top:10px}
.search input{flex:1;background:none;border:0;outline:0;color:var(--tx);font:inherit;font-size:15px;min-width:0}
.empty{color:var(--mut);text-align:center;padding:40px 10px;font-size:14px;line-height:1.6}
.seg{display:flex;padding:4px;border-radius:99px;margin-top:14px}
.seg button{flex:1;padding:9px;border-radius:99px;font-size:13px;font-weight:600}.seg .on{background:var(--ac);color:#031017}
.wm{text-align:center;color:var(--mut);font-size:11px;opacity:.7;margin-top:30px;letter-spacing:.3px}
nav{position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 10px);height:62px;border-radius:24px;display:flex;z-index:5;background:var(--gl2)}
nav button{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;font-size:11px;color:var(--mut);font-weight:600}
nav button svg{font-size:22px}nav .on{color:var(--ac)}
#mini{position:absolute;left:14px;right:14px;bottom:calc(env(safe-area-inset-bottom,0px) + 82px);border-radius:20px;padding:8px 10px;display:none;align-items:center;gap:10px;z-index:5;overflow:hidden;background:var(--gl2);box-shadow:var(--sh);animation:in .3s}
#mini.on{display:flex}
#mini img{width:44px;height:44px;border-radius:10px;object-fit:cover}
#mini .t{flex:1;min-width:0;text-align:left}
#mini p{font-size:13.5px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
#mini small{font-size:11px;color:var(--mut)}
#mbar{position:absolute;left:0;bottom:0;height:3px;background:var(--ac);width:0}
#full{position:fixed;inset:0;z-index:20;background:var(--bg);transform:translateY(105%);transition:transform .45s cubic-bezier(.2,.8,.2,1);overflow:hidden}
#full.on{transform:none}
#fbg{position:absolute;inset:-30px;background:center/cover;filter:blur(50px) saturate(1.5) brightness(.55);transition:background-image .5s}
:root[data-t=light] #fbg{filter:blur(50px) saturate(1.3) brightness(1.15) opacity(.6)}
#wm2{position:absolute;inset:-50%;transform:rotate(-24deg);display:flex;flex-wrap:wrap;gap:46px 60px;align-content:center;justify-content:center;font-weight:800;font-size:18px;opacity:.06;pointer-events:none;user-select:none}
.fin{position:relative;max-width:520px;margin:auto;height:100%;padding:calc(env(safe-area-inset-top,0px) + 14px) 26px calc(env(safe-area-inset-bottom,0px) + 24px);display:flex;flex-direction:column}
.art{flex:1;display:grid;place-items:center;min-height:0;padding:8px 0}
.art img{width:min(100%,46vh);aspect-ratio:1;object-fit:cover;border-radius:26px;box-shadow:0 30px 70px rgba(0,0,0,.5);transition:transform .5s}
.art.pause img{transform:scale(.86)}
.meta{display:flex;align-items:center;gap:12px}.meta div{flex:1;min-width:0}
.meta h3{font-size:21px;font-weight:800;letter-spacing:-.4px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.meta small{color:var(--mut);font-size:13px}
input[type=range]{-webkit-appearance:none;appearance:none;width:100%;height:5px;border-radius:9px;background:linear-gradient(90deg,var(--ac) var(--p,0%),var(--bd) var(--p,0%));outline:0;margin:18px 0 6px}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;border-radius:50%;background:var(--tx)}
.tm{display:flex;justify-content:space-between;font-size:11.5px;color:var(--mut)}
.ctl{display:flex;align-items:center;justify-content:space-between;margin:14px 0 6px}
.ctl .ib{font-size:26px;width:52px;height:52px}
#pp{width:74px;height:74px;font-size:34px;background:var(--tx);color:var(--bg);border-radius:50%;display:grid;place-items:center;transition:transform .15s}
#pp:active{transform:scale(.92)}
.act{color:var(--ac)}
.ld #pp{animation:pulse 1s infinite}@keyframes pulse{50%{opacity:.5}}
#toast{position:fixed;top:calc(env(safe-area-inset-top,0px) + 16px);left:50%;transform:translate(-50%,-120px);padding:11px 18px;border-radius:99px;z-index:50;font-size:13px;font-weight:600;transition:transform .35s;background:var(--gl2);max-width:90%}
#toast.on{transform:translate(-50%,0)}
#set{position:fixed;inset:0;z-index:30;display:none;align-items:flex-end;background:rgba(0,0,0,.45)}
#set.on{display:flex}#set .box{width:100%;max-width:640px;margin:auto;border-radius:26px 26px 0 0;padding:22px 20px calc(env(safe-area-inset-bottom,0px) + 26px);background:var(--gl2);animation:in .3s}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

$('#th').onclick=e=>{const t=e.target.dataset.t;if(t){theme=t;ls.set('theme',t);applyTheme()}};applyTheme();
$('#setb').onclick=()=>$('#set').classList.add('on');$('#set').onclick=e=>{if(e.target.id==='set')$('#set').classList.remove('on')};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('on');clearTimeout(toast.t);toast.t=setTimeout(()=>t.classList.remove('on'),2600)}
const esc=s=>String(s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
// API
async function lookup(q){let r;
 try{r=await fetch('/api/music?q='+encodeURIComponent(q))}catch{throw new Error('Server not reachable')}
 if(!r.ok)throw new Error(location.protocol==='file:'?'Open the hosted link, not the file':'Song not found ('+r.status+')');
 const j=await r.json();if(!j.success)throw new Error('Song not found');
 const t={q,title:j.title,channel:j.channel,thumb:j.thumbnail,audio:'/api/stream?q='+encodeURIComponent(q)};reg[q]=t;return t}
const meta=t=>({q:t.q,title:t.title,channel:t.channel,thumb:t.thumb});
// views
function show(v){$$('.view').forEach(e=>e.classList.toggle('on',e.id==='v-'+v));$$('nav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));$('main').scrollTop=0;if(v==='lib')renderLib();if(v==='search')renderHist()}
$('nav').onclick=e=>{const b=e.target.closest('button');if(b)show(b.dataset.v)};
const row=(t,l)=>{reg[t.q]=t;const c=queue[idx]&&queue[idx].q===t.q?' cur':'';return`<button class="row glass${c}" data-q="${esc(t.q)}" data-l="${l}"><img src="${esc(t.thumb)}" loading="lazy" alt=""><div><p>${esc(t.title)}</p><small>${esc(t.channel)}</small></div><span class="ib like ${liked.some(x=>x.q===t.q)?'on':''}" data-h="${esc(t.q)}">${I.heart}</span></button>`};
function bindList(el,list){el.onclick=e=>{const h=e.target.closest('[data-h]');if(h){e.stopPropagation();toggleLike(reg[h.dataset.h]);return}const r=e.target.closest('[data-q]');if(r){const i=list.findIndex(x=>x.q===r.dataset.q);play(list,i)}}}
function renderMoods(){$('#moods').innerHTML=MOODS.map(m=>`<button class="chip glass">${m}</button>`).join('');$('#moods').onclick=e=>{if(e.target.classList.contains('chip')){show('search');doSearch(e.target.textContent)}}}
async function loadHome(){$('#trend').innerHTML='<div class="sk"></div>'.repeat(4);
 const r=await Promise.allSettled(PRE.map(lookup));const bad=r.find(x=>x.status==='rejected');home=r.filter(x=>x.status==='fulfilled').map(x=>x.value);
 if(!home.length){$('#trend').innerHTML='<div class="empty" style="grid-column:1/3">Could not load songs.<br>'+(bad&&bad.reason&&bad.reason.message||'Check your connection')+'<br><button class="chip glass" id="rt">Retry</button></div>';$('#rt').onclick=loadHome;return}
 $('#trend').innerHTML=home.map(t=>`<button class="card glass" data-q="${esc(t.q)}"><img src="${esc(t.thumb)}" alt=""><p>${esc(t.title)}</p><small>${esc(t.channel)}</small></button>`).join('');bindList($('#trend'),home)}
async function doSearch(q){q=q.trim();if(!q)return;$('#q').value=q;hist=[q,...hist.filter(x=>x!==q)].slice(0,8);ls.set('hist',hist);renderHist();
 $('#res').innerHTML='<div class="sk" style="height:76px;margin-top:14px"></div>';
 try{const t=await lookup(q);const l=[t];$('#res').innerHTML='<h2>Top result</h2>'+row(t,'s');bindList($('#res'),l.concat(home.filter(h=>h.q!==t.q)))}
 catch{$('#res').innerHTML='<div class="empty">No song found for "'+esc(q)+'". Try another name or add the artist.</div>'}}
$('#sf').onsubmit=e=>{e.preventDefault();$('#q').blur();doSearch($('#q').value)};
function renderHist(){$('#hist').innerHTML=hist.map(h=>`<button class="chip glass">${esc(h)}</button>`).join('');$('#hist').onclick=e=>{if(e.target.classList.contains('chip'))doSearch(e.target.textContent)}}
function renderLib(){const l={liked,recent,queue}[libTab];$$('.seg button[data-l]').forEach(b=>b.classList.toggle('on',b.dataset.l===libTab));
 $('#libl').innerHTML=l.length?l.map(t=>row(t,'l')).join(''):`<div class="empty">${libTab==='liked'?'Tap the heart on any song to save it here.':libTab==='recent'?'Songs you play will show up here.':'Your queue is empty. Play a song to start.'}</div>`;bindList($('#libl'),l)}
$('#v-lib .seg').onclick=e=>{if(e.target.dataset.l){libTab=e.target.dataset.l;renderLib()}};
function toggleLike(t){if(!t)return;const i=liked.findIndex(x=>x.q===t.q);i>=0?liked.splice(i,1):liked.unshift(meta(t));ls.set('liked',liked);syncLike();$$('[data-h]').forEach(e=>e.classList.toggle('on',liked.some(x=>x.q===e.dataset.h)));if($('#v-lib').classList.contains('on')&&libTab==='liked')renderLib();toast(i>=0?'Removed from Liked songs':'Added to Liked songs')}
function syncLike(){const t=queue[idx];$('#fl').classList.toggle('on',!!t&&liked.some(x=>x.q===t.q))}
// player
async function play(list,i){if(i<0)return;queue=list.slice();idx=i;load()}
async function load(retry){const t=queue[idx];if(!t)return;const my=++tok;
 $('#mini').classList.add('on');$('#full').classList.add('ld');paint(t);
 try{const f=await lookup(t.q);if(my!==tok)return;queue[idx]=Object.assign(t,f);au.src=f.audio;await au.play();
  recent=[meta(t),...recent.filter(x=>x.q!==t.q)].slice(0,30);ls.set('recent',recent);setMS(t)}
 catch(e){if(my!==tok)return;if(e&&e.name==='NotAllowedError')return;$('#full').classList.remove('ld');toast((e&&e.message||'Playback failed')+(e&&e.px?' (proxy)':'')+'. Skipping...');if(!retry&&queue.length>1)setTimeout(()=>step(1,true),900)}}
function paint(t){$('#mi').src=t.thumb;$('#mt').innerHTML=`<p>${esc(t.title)}</p><small>${esc(t.channel)}</small>`;$('#fi').src=t.thumb;$('#fbg').style.backgroundImage=`url("${t.thumb}")`;$('#ft').textContent=t.title;$('#fc').textContent=t.channel;document.title=t.title+' · Harsh Music';syncLike();$$('.row').forEach(r=>r.classList.toggle('cur',r.dataset.q===t.q))}
function step(d,auto){if(!queue.length)return;if(shuffle&&queue.length>1){let n;do n=Math.floor(Math.random()*queue.length);while(n===idx);idx=n}else{idx+=d;if(idx>=queue.length){if(repeat===1||!auto)idx=0;else{idx=queue.length-1;return}}if(idx<0)idx=0}load()}
au.onplaying=()=>{$('#full').classList.remove('ld');ui(true)};au.onpause=()=>ui(false);
function ui(p){$('#pp').innerHTML=p?I.pause:I.play;$('#mpp').innerHTML=p?I.pause:I.play;$('#art').classList.toggle('pause',!p);if('mediaSession'in navigator)navigator.mediaSession.playbackState=p?'playing':'paused'}
au.onended=()=>{if(repeat===2){au.currentTime=0;au.play()}else step(1,true)};
au.onerror=()=>{const t=queue[idx];if(!au.getAttribute('src'))return;if(!au._r){au._r=1;load(true)}else{au._r=0;$('#full').classList.remove('ld');console.log('Audio error',au.error);toast(t&&t.px?'Audio link locked to proxy IP. Host app with own proxy.':'Audio blocked by server (code '+(au.error?au.error.code:'?')+')')}};au.oncanplay=()=>au._r=0;
const fmt=s=>isFinite(s)?Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0'):'0:00';
au.ontimeupdate=()=>{const p=au.duration?au.currentTime/au.duration*100:0;$('#mbar').style.width=p+'%';if(!seeking){$('#sk').value=p*10;$('#sk').style.setProperty('--p',p+'%')}$('#cur').textContent=fmt(au.currentTime);$('#dur').textContent=fmt(au.duration);
 if('mediaSession'in navigator&&au.duration&&navigator.mediaSession.setPositionState)try{navigator.mediaSession.setPositionState({duration:au.duration,position:au.currentTime,playbackRate:1})}catch{}};
let seeking=false;const sk=$('#sk');
sk.oninput=()=>{seeking=true;sk.style.setProperty('--p',sk.value/10+'%');$('#cur').textContent=fmt(au.duration*sk.value/1000)};
sk.onchange=()=>{if(au.duration)au.currentTime=au.duration*sk.value/1000;seeking=false};
const toggle=()=>{if(!au.src)return;au.paused?au.play():au.pause()};
$('#pp').onclick=toggle;$('#mpp').onclick=toggle;$('#nx').onclick=()=>step(1);$('#mnx').onclick=()=>step(1);
$('#pv').onclick=()=>{if(au.currentTime>4)au.currentTime=0;else step(-1)};
$('#sh').onclick=()=>{shuffle=!shuffle;$('#sh').classList.toggle('act',shuffle);toast('Shuffle '+(shuffle?'on':'off'))};
$('#rp').onclick=()=>{repeat=(repeat+1)%3;$('#rp').classList.toggle('act',repeat>0);toast(['Repeat off','Repeat all','Repeat one'][repeat])};
$('#fl').onclick=()=>toggleLike(queue[idx]);
$('#mt').onclick=()=>$('#full').classList.add('on');$('#fx').onclick=()=>$('#full').classList.remove('on');
$('#fq').onclick=()=>{$('#full').classList.remove('on');libTab='queue';show('lib')};
document.onkeydown=e=>{if(e.target.tagName==='INPUT'&&e.target.type==='text')return;if(e.code==='Space'){e.preventDefault();toggle()}if(e.code==='ArrowRight')step(1);if(e.code==='ArrowLeft')step(-1)};
function setMS(t){if(!('mediaSession'in navigator))return;navigator.mediaSession.metadata=new MediaMetadata({title:t.title,artist:t.channel,album:'Harsh Music',artwork:[{src:t.thumb,sizes:'480x360',type:'image/jpeg'}]});
 const m=navigator.mediaSession;[['play',()=>au.play()],['pause',()=>au.pause()],['previoustrack',()=>step(-1)],['nexttrack',()=>step(1)],['seekto',d=>{au.currentTime=d.seekTime}],['seekbackward',()=>au.currentTime-=10],['seekforward',()=>au.currentTime+=10]].forEach(([a,f])=>{try{m.setActionHandler(a,f)}catch{}})}
renderMoods();renderHist();loadHome();
if('serviceWorker'in navigator&&location.protocol.startsWith('http'))addEventListener('load',()=>{});
</script></body></html>
